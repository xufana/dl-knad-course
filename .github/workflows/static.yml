
name: Deploy Course Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir -p dist

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dist' \
            ./ dist/

          python3 - <<'PY'
          from pathlib import Path
          from html import escape
          from urllib.parse import quote
          import re

          root = Path("dist")

          # Find HTML lectures and Jupyter seminars
          files = sorted(
              p for p in root.rglob("*")
              if p.is_file()
              and p.suffix.lower() in (".html", ".ipynb")
              and p.relative_to(root).as_posix() != "index.html"
          )

          # Group materials by week folder
          groups = {}

          for file in files:
              relative = file.relative_to(root)

              if len(relative.parts) > 1:
                  folder = relative.parts[0]
              else:
                  folder = "Материалы"

              groups.setdefault(folder, []).append(file)

          def natural_key(value):
            value = str(value)
            return [
                int(part) if part.isdigit() else part.lower()
                for part in re.split(r"(\d+)", value)
            ]

          def folder_title(folder):
              match = re.search(
                  r'week[_ -]?(\d+)',
                  folder,
                  re.IGNORECASE
              )

              if match:
                  return f"Неделя {int(match.group(1))}"

              match = re.search(
                  r'неделя[_ -]?(\d+)',
                  folder,
                  re.IGNORECASE
              )

              if match:
                  return f"Неделя {int(match.group(1))}"

              return folder.replace("_", " ").replace("-", " ").title()

          def material_title(file, number, total):
              if file.suffix.lower() == ".ipynb":
                  label = "Семинар"
              else:
                  label = "Лекция"

              if total > 1:
                  return f"{label} {number}"

              return label

          cards = ""

          for folder in sorted(groups, key=natural_key):
              pages = sorted(groups[folder], key=natural_key)

              lectures = [
                  p for p in pages
                  if p.suffix.lower() == ".html"
              ]

              seminars = [
                  p for p in pages
                  if p.suffix.lower() == ".ipynb"
              ]

              cards += f"""
              <section class="week">
                <div class="week-head">
                  <h2>{escape(folder_title(folder))}</h2>
                  <span class="count">
                    {len(lectures)} лекц. · {len(seminars)} сем.
                  </span>
                </div>
                <div class="materials">
              """

              for material_type, items in [
                  ("Лекция", lectures),
                  ("Семинар", seminars)
              ]:
                  for i, page in enumerate(items, start=1):
                      relative = page.relative_to(root).as_posix()

                      if page.suffix.lower() == ".ipynb":
                          url = (
                              "https://github.com/xufana/"
                              "dl-knad-course/blob/main/"
                              + quote(relative, safe="/")
                          )
                      else:
                          url = "./" + quote(relative, safe="/")

                      title = material_title(
                          page, i, len(items)
                      )

                      icon = "▤" if material_type == "Лекция" else "▧"

                      cards += f"""
                      <a class="material"
                         href="{escape(url, quote=True)}"
                         target="_blank"
                         rel="noopener noreferrer">
                        <span class="material-icon">{icon}</span>
                        <span class="material-name">
                          {escape(title)}
                        </span>
                        <span class="arrow">→</span>
                      </a>
                      """

              cards += """
                </div>
              </section>
              """

          document = f"""<!DOCTYPE html>
          <html lang="ru">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport"
                  content="width=device-width, initial-scale=1">

            <title>Deep Learning & Knowledge Analysis</title>

            <style>
              * {{
                box-sizing: border-box;
              }}

              body {{
                margin: 0;
                background: #f5f6fa;
                color: #172033;
                font-family: Inter, -apple-system,
                  BlinkMacSystemFont, "Segoe UI", sans-serif;
                line-height: 1.6;
              }}

              .hero {{
                background: #111827;
                color: white;
                padding: 75px 24px 85px;
              }}

              .hero-inner, main, footer {{
                max-width: 900px;
                margin: auto;
              }}

              .tag {{
                color: #93c5fd;
                font-size: 12px;
                font-weight: 700;
                letter-spacing: 2px;
                text-transform: uppercase;
              }}

              h1 {{
                font-size: clamp(34px, 6vw, 58px);
                line-height: 1.12;
                letter-spacing: -2px;
                max-width: 700px;
                margin: 22px 0;
              }}

              .subtitle {{
                color: #aebbd0;
                font-size: 17px;
                max-width: 580px;
              }}

              main {{
                padding: 48px 24px;
              }}

              .section-title {{
                font-size: 25px;
                margin-bottom: 28px;
              }}

              .week {{
                background: white;
                border: 1px solid #e5e9f0;
                border-radius: 14px;
                padding: 24px;
                margin-bottom: 18px;
                transition: box-shadow .2s, transform .2s;
              }}

              .week:hover {{
                box-shadow: 0 8px 28px #1720330c;
                transform: translateY(-2px);
              }}

              .week-head {{
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                margin-bottom: 16px;
              }}

              .week-head h2 {{
                font-size: 18px;
                margin: 0;
              }}

              .count {{
                color: #94a3b8;
                font-size: 12px;
                white-space: nowrap;
              }}

              .materials {{
                border-top: 1px solid #edf0f4;
              }}

              .material {{
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 14px 4px;
                border-bottom: 1px solid #edf0f4;
                color: #25344d;
                text-decoration: none;
                font-size: 15px;
                transition: color .2s;
              }}

              .material:last-child {{
                border-bottom: 0;
              }}

              .material:hover {{
                color: #2563eb;
              }}

              .material-icon {{
                color: #3b82f6;
                font-size: 19px;
              }}

              .arrow {{
                margin-left: auto;
                color: #94a3b8;
              }}

              footer {{
                padding: 24px;
                border-top: 1px solid #e2e8f0;
                color: #94a3b8;
                font-size: 12px;
                text-align: center;
              }}

              @media(max-width: 600px) {{
                .hero {{
                  padding: 55px 22px 65px;
                }}

                main {{
                  padding: 35px 16px;
                }}

                .week {{
                  padding: 18px;
                }}
              }}
            </style>
          </head>

          <body>
            <header class="hero">
              <div class="hero-inner">
                <div class="tag">
                  Учебные материалы · 2026
                </div>

                <h1>
                  Deep Learning & Knowledge Analysis
                </h1>

                <p class="subtitle">
                  Лекции, семинары и практические
                  материалы курса.
                </p>
              </div>
            </header>

            <main>
              <h2 class="section-title">
                Программа курса
              </h2>

              {cards if cards else "<p>Материалы скоро появятся.</p>"}
            </main>

            <footer>
              DEEP LEARNING & KNOWLEDGE ANALYSIS
              · COURSE MATERIALS
            </footer>
          </body>
          </html>
          """

          (root / "index.html").write_text(
              document,
              encoding="utf-8"
          )

          print(f"Found {len(files)} materials")
          print(f"Generated {len(groups)} weeks")
          PY

      - name: Debug published files
        run: |
          find dist -type f \( -iname "*.html" -o -iname "*.ipynb" \)

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
